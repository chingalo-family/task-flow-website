<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A2332"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="grad" cx="30%" cy="50%">
      <stop offset="0%" style="stop-color:#2E90FA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1A2332;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Task icon -->
  <rect x="150" y="180" width="200" height="30" rx="15" fill="#2E90FA"/>
  <rect x="150" y="230" width="150" height="30" rx="15" fill="#2E90FA"/>
  <rect x="150" y="280" width="180" height="30" rx="15" fill="#2E90FA"/>
  <circle cx="130" cy="195" r="10" fill="#10B981"/>
  <circle cx="130" cy="245" r="10" fill="#10B981"/>
  <circle cx="130" cy="295" r="10" fill="#94A3B8"/>
  
  <!-- Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Task Flow</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="42" fill="#2E90FA" text-anchor="middle">Collaborate and Achieve</text>
  
  <!-- Description -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Streamline your team's workflow</text>
</svg>
