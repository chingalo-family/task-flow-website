<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1729;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone Body -->
  <rect width="375" height="812" rx="40" fill="#1A2332"/>
  
  <!-- Screen -->
  <rect x="10" y="10" width="355" height="792" rx="30" fill="url(#screenGrad)"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="355" height="44" rx="30" fill="#1A2332"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">9:41</text>
  <circle cx="320" cy="30" r="3" fill="#10B981"/>
  <rect x="330" y="26" width="20" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="332" y="28" width="14" height="6" fill="#10B981"/>
  
  <!-- App Header -->
  <rect x="10" y="54" width="355" height="60" fill="#243447"/>
  <g transform="translate(20, 0)">
    <path d="M 15 80 L 20 85 L 15 90" stroke="#2E90FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Task Management</text>
  
  <!-- Task Details Card -->
  <rect x="30" y="134" width="315" height="300" rx="16" fill="#243447"/>
  
  <!-- Task Title -->
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Complete Website Launch</text>
  
  <!-- Status Badge -->
  <rect x="50" y="185" width="70" height="24" rx="12" fill="rgba(46, 144, 250, 0.2)"/>
  <text x="60" y="202" font-family="Arial, sans-serif" font-size="12" fill="#2E90FA" font-weight="600">IN PROGRESS</text>
  
  <!-- Priority Badge -->
  <rect x="130" y="185" width="50" height="24" rx="12" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="140" y="202" font-family="Arial, sans-serif" font-size="12" fill="#EF4444" font-weight="600">HIGH</text>
  
  <!-- Divider -->
  <line x1="50" y1="225" x2="325" y2="225" stroke="#94A3B8" stroke-width="1" opacity="0.3"/>
  
  <!-- Details Section -->
  <g>
    <!-- Due Date -->
    <circle cx="55" cy="250" r="8" fill="none" stroke="#2E90FA" stroke-width="2"/>
    <text x="50" y="255" font-family="Arial, sans-serif" font-size="11" fill="#2E90FA" font-weight="bold">!</text>
    <text x="75" y="253" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Due Date</text>
    <text x="260" y="253" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Jan 10, 2025</text>
    
    <!-- Assignee -->
    <circle cx="55" cy="285" r="8" fill="#2E90FA"/>
    <text x="50" y="289" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">J</text>
    <text x="75" y="288" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Assigned to</text>
    <text x="260" y="288" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">John Doe</text>
    
    <!-- Project -->
    <rect x="47" y="310" width="16" height="16" rx="4" fill="none" stroke="#2E90FA" stroke-width="2"/>
    <text x="75" y="323" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Project</text>
    <text x="245" y="323" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">Website Redesign</text>
    
    <!-- Progress -->
    <circle cx="55" cy="355" r="8" fill="none" stroke="#2E90FA" stroke-width="2"/>
    <path d="M 55 347 L 55 355 L 60 360" stroke="#2E90FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="358" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Progress</text>
    <text x="290" y="358" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="500">65%</text>
  </g>
  
  <!-- Progress Bar -->
  <rect x="50" y="380" width="275" height="8" rx="4" fill="rgba(148, 163, 184, 0.2)"/>
  <rect x="50" y="380" width="178.75" height="8" rx="4" fill="#2E90FA"/>
  
  <!-- Description -->
  <text x="50" y="415" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" font-weight="600">Description</text>
  
  <!-- Description Card -->
  <rect x="30" y="454" width="315" height="120" rx="12" fill="#1A2332"/>
  <text x="50" y="480" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Finalize all pages, test responsiveness,</text>
  <text x="50" y="502" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">add legal documents, optimize images,</text>
  <text x="50" y="524" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">and deploy to GitHub Pages.</text>
  <text x="50" y="556" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Review SEO and accessibility.</text>
  
  <!-- Checklist Section -->
  <text x="30" y="600" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" font-weight="600">Subtasks (3/5)</text>
  
  <!-- Subtasks -->
  <g>
    <circle cx="45" cy="625" r="8" fill="#10B981"/>
    <path d="M 41 625 L 44 628 L 49 622" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="629" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-decoration="line-through">Create homepage</text>
    
    <circle cx="45" cy="655" r="8" fill="#10B981"/>
    <path d="M 41 655 L 44 658 L 49 652" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="659" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-decoration="line-through">Add privacy policy</text>
    
    <circle cx="45" cy="685" r="8" fill="#10B981"/>
    <path d="M 41 685 L 44 688 L 49 682" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="689" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" text-decoration="line-through">Setup GitHub Actions</text>
    
    <circle cx="45" cy="715" r="8" fill="none" stroke="#2E90FA" stroke-width="2"/>
    <text x="65" y="719" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Test deployment</text>
    
    <circle cx="45" cy="745" r="8" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text x="65" y="749" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Final review</text>
  </g>
  
  <!-- Action Buttons -->
  <rect x="30" y="772" width="150" height="20" rx="10" fill="#2E90FA"/>
  <text x="70" y="786" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">Mark Complete</text>
  
  <rect x="195" y="772" width="150" height="20" rx="10" fill="none" stroke="#2E90FA" stroke-width="2"/>
  <text x="245" y="786" font-family="Arial, sans-serif" font-size="12" fill="#2E90FA" font-weight="600">Edit Task</text>
</svg>
