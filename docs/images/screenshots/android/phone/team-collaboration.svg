<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1729;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone Body -->
  <rect width="375" height="812" rx="40" fill="#1A2332"/>
  
  <!-- Screen -->
  <rect x="10" y="10" width="355" height="792" rx="30" fill="url(#screenGrad)"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="355" height="44" rx="30" fill="#1A2332"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">9:41</text>
  <circle cx="320" cy="30" r="3" fill="#10B981"/>
  <rect x="330" y="26" width="20" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="332" y="28" width="14" height="6" fill="#10B981"/>
  
  <!-- App Header -->
  <rect x="10" y="54" width="355" height="60" fill="#243447"/>
  <text x="30" y="90" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Team Collaboration</text>
  <circle cx="330" cy="84" r="12" fill="#2E90FA"/>
  <text x="325" y="89" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">+</text>
  
  <!-- Team Info Card -->
  <rect x="30" y="134" width="315" height="140" rx="16" fill="#243447"/>
  
  <!-- Team Header -->
  <g>
    <circle cx="55" cy="164" r="20" fill="#2E90FA"/>
    <text x="47" y="172" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">WD</text>
    
    <text x="85" y="165" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">Website Development</text>
    <text x="85" y="185" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">5 members • 12 active tasks</text>
  </g>
  
  <!-- Stats -->
  <g>
    <rect x="50" y="210" width="80" height="50" rx="8" fill="#1A2332"/>
    <text x="65" y="232" font-family="Arial, sans-serif" font-size="20" fill="#10B981" font-weight="bold">8</text>
    <text x="60" y="252" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Completed</text>
    
    <rect x="145" y="210" width="80" height="50" rx="8" fill="#1A2332"/>
    <text x="165" y="232" font-family="Arial, sans-serif" font-size="20" fill="#2E90FA" font-weight="bold">12</text>
    <text x="160" y="252" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">In Progress</text>
    
    <rect x="240" y="210" width="80" height="50" rx="8" fill="#1A2332"/>
    <text x="260" y="232" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8" font-weight="bold">4</text>
    <text x="265" y="252" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Pending</text>
  </g>
  
  <!-- Team Members Section -->
  <text x="30" y="304" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" font-weight="600">Team Members (5)</text>
  
  <!-- Member 1 - Admin -->
  <rect x="30" y="324" width="315" height="70" rx="12" fill="#243447"/>
  <circle cx="55" cy="359" r="18" fill="#2E90FA"/>
  <text x="48" y="365" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">JD</text>
  <text x="85" y="357" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">John Doe</text>
  <text x="85" y="375" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">john@taskflow.com</text>
  <rect x="265" y="350" width="55" height="20" rx="10" fill="rgba(46, 144, 250, 0.2)"/>
  <text x="273" y="364" font-family="Arial, sans-serif" font-size="10" fill="#2E90FA" font-weight="600">ADMIN</text>
  
  <!-- Member 2 -->
  <rect x="30" y="404" width="315" height="70" rx="12" fill="#243447"/>
  <circle cx="55" cy="439" r="18" fill="#10B981"/>
  <text x="48" y="445" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">JS</text>
  <text x="85" y="437" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">Jane Smith</text>
  <text x="85" y="455" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">jane@taskflow.com</text>
  <rect x="265" y="430" width="55" height="20" rx="10" fill="rgba(148, 163, 184, 0.2)"/>
  <text x="270" y="444" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">MEMBER</text>
  
  <!-- Member 3 -->
  <rect x="30" y="484" width="315" height="70" rx="12" fill="#243447"/>
  <circle cx="55" cy="519" r="18" fill="#FF6B9D"/>
  <text x="47" y="525" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">MJ</text>
  <text x="85" y="517" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">Mike Johnson</text>
  <text x="85" y="535" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">mike@taskflow.com</text>
  <rect x="265" y="510" width="55" height="20" rx="10" fill="rgba(148, 163, 184, 0.2)"/>
  <text x="270" y="524" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" font-weight="600">MEMBER</text>
  
  <!-- Recent Activity Section -->
  <text x="30" y="584" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" font-weight="600">Recent Activity</text>
  
  <!-- Activity 1 -->
  <g>
    <circle cx="45" cy="615" r="6" fill="#10B981"/>
    <text x="60" y="617" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">John completed "Add privacy policy"</text>
    <text x="60" y="634" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">2 hours ago</text>
  </g>
  
  <!-- Activity 2 -->
  <g>
    <circle cx="45" cy="665" r="6" fill="#2E90FA"/>
    <text x="60" y="667" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Jane assigned task to Mike</text>
    <text x="60" y="684" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">5 hours ago</text>
  </g>
  
  <!-- Activity 3 -->
  <g>
    <circle cx="45" cy="715" r="6" fill="#F59E0B"/>
    <text x="60" y="717" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">Mike commented on a task</text>
    <text x="60" y="734" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Yesterday</text>
  </g>
  
  <!-- Action Button -->
  <rect x="30" y="765" width="315" height="24" rx="12" fill="#2E90FA"/>
  <text x="130" y="781" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Invite Team Member</text>
</svg>
