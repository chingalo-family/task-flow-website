<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Phone Frame -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1729;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone Body -->
  <rect width="375" height="812" rx="40" fill="#1A2332"/>
  
  <!-- Screen -->
  <rect x="10" y="10" width="355" height="792" rx="30" fill="url(#screenGrad)"/>
  
  <!-- Status Bar -->
  <rect x="10" y="10" width="355" height="44" rx="30" fill="#1A2332"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">9:41</text>
  <circle cx="320" cy="30" r="3" fill="#10B981"/>
  <rect x="330" y="26" width="20" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="332" y="28" width="14" height="6" fill="#10B981"/>
  
  <!-- Notification Badge -->
  <circle cx="340" cy="20" r="8" fill="#EF4444"/>
  <text x="336" y="24" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">3</text>
  
  <!-- App Header -->
  <rect x="10" y="54" width="355" height="60" fill="#243447"/>
  <text x="30" y="90" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">Notifications</text>
  <circle cx="330" cy="84" r="12" fill="none" stroke="#2E90FA" stroke-width="2"/>
  <path d="M 325 84 L 330 79 L 335 84" stroke="#2E90FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Filter Tabs -->
  <g>
    <rect x="30" y="124" width="80" height="32" rx="16" fill="#2E90FA"/>
    <text x="50" y="145" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">All (12)</text>
    
    <rect x="120" y="124" width="80" height="32" rx="16" fill="#243447"/>
    <text x="133" y="145" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="500">Tasks (8)</text>
    
    <rect x="210" y="124" width="80" height="32" rx="16" fill="#243447"/>
    <text x="219" y="145" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8" font-weight="500">Teams (4)</text>
  </g>
  
  <!-- Today Section -->
  <text x="30" y="186" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" font-weight="600">TODAY</text>
  
  <!-- Notification 1 - Urgent -->
  <rect x="30" y="200" width="315" height="90" rx="12" fill="#243447"/>
  <rect x="30" y="200" width="4" height="90" rx="2" fill="#EF4444"/>
  <circle cx="55" cy="230" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="50" y="235" font-family="Arial, sans-serif" font-size="16" fill="#EF4444" font-weight="bold">!</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Urgent: Deadline Approaching</text>
  <text x="80" y="245" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">"Website deployment" is due in 2 hours</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">10:30 AM</text>
  <circle cx="325" cy="230" r="6" fill="#EF4444"/>
  
  <!-- Notification 2 - Task Complete -->
  <rect x="30" y="300" width="315" height="90" rx="12" fill="#243447"/>
  <rect x="30" y="300" width="4" height="90" rx="2" fill="#10B981"/>
  <circle cx="55" cy="330" r="14" fill="rgba(16, 185, 129, 0.2)"/>
  <path d="M 50 330 L 53 333 L 60 325" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Task Completed</text>
  <text x="80" y="345" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">John marked "Add privacy policy" as complete</text>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">9:15 AM</text>
  
  <!-- Notification 3 - Team Invite -->
  <rect x="30" y="400" width="315" height="90" rx="12" fill="#243447"/>
  <rect x="30" y="400" width="4" height="90" rx="2" fill="#2E90FA"/>
  <circle cx="55" cy="430" r="14" fill="rgba(46, 144, 250, 0.2)"/>
  <circle cx="55" cy="426" r="5" fill="#2E90FA"/>
  <path d="M 48 437 Q 55 434 62 437" stroke="#2E90FA" stroke-width="2" fill="none"/>
  <text x="80" y="425" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">New Team Member</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Sarah joined "Website Development" team</text>
  <text x="80" y="465" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">8:45 AM</text>
  
  <!-- Yesterday Section -->
  <text x="30" y="520" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8" font-weight="600">YESTERDAY</text>
  
  <!-- Notification 4 - Comment -->
  <rect x="30" y="534" width="315" height="90" rx="12" fill="#243447"/>
  <rect x="30" y="534" width="4" height="90" rx="2" fill="#F59E0B"/>
  <circle cx="55" cy="564" r="14" fill="rgba(245, 158, 11, 0.2)"/>
  <rect x="48" y="557" width="14" height="14" rx="2" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="49" y="568" font-family="Arial, sans-serif" font-size="12" fill="#F59E0B" font-weight="bold">"</text>
  <text x="80" y="559" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">New Comment</text>
  <text x="80" y="579" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Mike commented: "Great progress!"</text>
  <text x="80" y="599" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Yesterday, 4:20 PM</text>
  
  <!-- Notification 5 - Mention -->
  <rect x="30" y="634" width="315" height="90" rx="12" fill="#243447"/>
  <rect x="30" y="634" width="4" height="90" rx="2" fill="#FF6B9D"/>
  <circle cx="55" cy="664" r="14" fill="rgba(255, 107, 157, 0.2)"/>
  <text x="50" y="670" font-family="Arial, sans-serif" font-size="14" fill="#FF6B9D" font-weight="bold">@</text>
  <text x="80" y="659" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">You were mentioned</text>
  <text x="80" y="679" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Jane mentioned you in "Deploy to GitHub"</text>
  <text x="80" y="699" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Yesterday, 2:10 PM</text>
  
  <!-- Clear All Button -->
  <rect x="30" y="750" width="315" height="40" rx="20" fill="none" stroke="#2E90FA" stroke-width="2"/>
  <text x="125" y="774" font-family="Arial, sans-serif" font-size="14" fill="#2E90FA" font-weight="600">Mark All as Read</text>
</svg>
